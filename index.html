<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLATS AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #4d6358;
      color: #fffffd;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 17px;
      margin-bottom: 25px;
    }

    model-viewer {
      width: 100%;
      max-width: 600px;
      height: 60vh;
      background: #fffffd;
      border-radius: 20px;
    }

    .ar-button {
      margin-top: 20px;
      padding: 16px 30px;
      border: none;
      border-radius: 30px;
      background: #bed076;
      color: #26352e;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>FLATS</h1>

    <p>Experience FLATS in Augmented Reality</p>

    <model-viewer
      src="flats.glb"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1">

      <button class="ar-button" slot="ar-button">
        VIEW FLATS IN AR
      </button>

    </model-viewer>

  </div>

</body>
</html>
