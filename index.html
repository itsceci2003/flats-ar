<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FLATS AR Test</title>

    <!-- Google Model Viewer -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #FFFFFD;
            font-family: Arial, sans-serif;
            color: #4D6358;
            text-align: center;
        }

        header {
            padding: 25px 20px 10px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .viewer {
            width: 100%;
            height: 70vh;
            min-height: 400px;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #f5f5f2;

            --poster-color: transparent;
            --progress-bar-color: #4D6358;

            touch-action: pan-y;
        }

        #ar-button {
            background: #4D6358;
            color: #FFFFFD;

            border: none;
            border-radius: 40px;

            padding: 16px 25px;

            font-size: 14px;
            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .instructions {
            padding: 20px;

            font-size: 14px;
            line-height: 1.6;

            color: #68776F;
        }

    </style>
</head>


<body>

    <header>

        <div class="logo">
            FLATS
        </div>

        <div class="subtitle">
            AUGMENTED REALITY TEST
        </div>

    </header>


    <div class="viewer">

        <model-viewer

            src="test.glb"

            alt="FLATS 3D Model"

            camera-controls

            auto-rotate

            shadow-intensity="1"

            exposure="1"

            ar

            ar-modes="webxr scene-viewer quick-look"

            placement="floor"

            camera-orbit="0deg 75deg 105%"

            field-of-view="30deg"

        >

            <button
                id="ar-button"
                slot="ar-button">

                📷 VIEW IN AR

            </button>

        </model-viewer>

    </div>


    <div class="instructions">

        <p>
            <strong>Desktop:</strong>
            Drag to rotate and scroll to zoom.
        </p>

        <p>
            <strong>Phone:</strong>
            Tap "View in AR" to place the model
            in your surroundings.
        </p>

    </div>


    <script>

        const modelViewer =
            document.querySelector("model-viewer");

        modelViewer.addEventListener("load", () => {

            console.log("3D model loaded!");

        });

        modelViewer.addEventListener("error", (error) => {

            console.error(
                "Could not load the GLB:",
                error
            );

        });

        modelViewer.addEventListener("ar-status", (event) => {

            console.log(
                "AR status:",
                event.detail.status
            );

        });

    </script>

</body>
</html>
